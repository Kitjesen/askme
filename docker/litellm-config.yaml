model_list:
  # Product capability aliases are the stable contract used by AskMe.
  # Vendor model names below remain available only for migration/operations.
  - model_name: voice-fast
    litellm_params:
      model: openai/deepseek-v4-flash
      api_base: os.environ/DEEPSEEK_BASE_URL
      api_key: os.environ/DEEPSEEK_API_KEY

  - model_name: voice-quality
    litellm_params:
      model: openai/deepseek-v4-pro
      api_base: os.environ/DEEPSEEK_BASE_URL
      api_key: os.environ/DEEPSEEK_API_KEY

  - model_name: robot-action
    litellm_params:
      model: openai/deepseek-v4-flash
      api_base: os.environ/DEEPSEEK_BASE_URL
      api_key: os.environ/DEEPSEEK_API_KEY

  - model_name: memory-compact
    litellm_params:
      model: openai/deepseek-v4-flash
      api_base: os.environ/DEEPSEEK_BASE_URL
      api_key: os.environ/DEEPSEEK_API_KEY

  - model_name: health-probe
    litellm_params:
      model: openai/deepseek-v4-flash
      api_base: os.environ/DEEPSEEK_BASE_URL
      api_key: os.environ/DEEPSEEK_API_KEY

  - model_name: deepseek-v4-flash
    litellm_params:
      model: openai/deepseek-v4-flash
      api_base: os.environ/DEEPSEEK_BASE_URL
      api_key: os.environ/DEEPSEEK_API_KEY

  - model_name: deepseek-v4-pro
    litellm_params:
      model: openai/deepseek-v4-pro
      api_base: os.environ/DEEPSEEK_BASE_URL
      api_key: os.environ/DEEPSEEK_API_KEY

  - model_name: MiniMax-M2.7-highspeed
    litellm_params:
      model: openai/MiniMax-M2.7-highspeed
      api_base: https://api.minimaxi.com/v1
      api_key: os.environ/MINIMAX_API_KEY

litellm_settings:
  num_retries: 0
  request_timeout: 10
  set_verbose: false
  json_logs: true

router_settings:
  routing_strategy: simple-shuffle
  fallbacks:
    - voice-fast:
        - voice-quality
    - memory-compact:
        - voice-quality
    - deepseek-v4-flash:
        - deepseek-v4-pro

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  disable_error_logs: true
  turn_off_message_logging: true
  redact_user_api_key_info: true
