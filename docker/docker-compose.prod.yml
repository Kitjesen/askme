# ─────────────────────────────────────────────────────────────
# Askme + ZeroClaw — 生产环境 Compose 覆盖
# ─────────────────────────────────────────────────────────────
# 使用方式：
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# 此文件覆盖 docker-compose.yml 中的 dev 默认值，
# 用于正式生产部署。
# ─────────────────────────────────────────────────────────────

x-logging: &prod-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"
    compress: "true"

services:
  zeroclaw:
    logging: *prod-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "128M"
        reservations:
          cpus: "0.1"
          memory: "32M"
    environment:
      - RUST_LOG=warn
      - ZEROCLAW_LOG_LEVEL=warn

  askme:
    logging: *prod-logging
    # 生产环境：关闭 hot-reload，更严格的资源限制
    environment:
      # 日志级别提升到 WARNING，减少生产日志量
      - ASKME_LOG_LEVEL=WARNING
      - ASKME_HEALTH_LOG_LEVEL=warning
      # 关闭热重载（如果支持）
      - ASKME_HOT_RELOAD=0
      - ASKME_DEV_MODE=0
      # 控制 API 密钥（生产必须设置）
      - ASKME_CONTROL_API_KEY=${ASKME_CONTROL_API_KEY}
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: "1.5G"
        reservations:
          cpus: "1"
          memory: "1G"
    # 生产：重启限制，防止无限循环
    restart: unless-stopped
    # 生产环境不暴露端口到宿主机（通过反向代理暴露）
    # ports:
    #   - "8765:8765"
