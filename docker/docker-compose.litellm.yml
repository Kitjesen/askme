name: askme-litellm

x-key-policy-common: &key-policy-common
  build:
    context: ..
    dockerfile: docker/Dockerfile.askme
  restart: "no"
  network_mode: none
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  litellm-key-policy:
    <<: *key-policy-common
    entrypoint: ["python", "-m", "askme.llm.key_policy", "--control-plane-only"]
    environment:
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY}"
      LITELLM_SALT_KEY: "${LITELLM_SALT_KEY:?set LITELLM_SALT_KEY}"
      LITELLM_DATABASE_PASSWORD: "${LITELLM_DATABASE_PASSWORD:?set LITELLM_DATABASE_PASSWORD}"

  litellm-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: "${LITELLM_DATABASE_PASSWORD:?set LITELLM_DATABASE_PASSWORD}"
    volumes:
      - litellm_db:/var/lib/postgresql/data
    networks:
      - askme-net
    depends_on:
      litellm-key-policy:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm-database:v1.93.0@sha256:72360d8bd5602faa49be5098a8ac3dd069d9fb74503d6bd014242d96dc753e43
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    environment:
      DATABASE_URL: "postgresql://litellm:${LITELLM_DATABASE_PASSWORD}@litellm-db:5432/litellm"
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY}"
      LITELLM_SALT_KEY: "${LITELLM_SALT_KEY:?set LITELLM_SALT_KEY}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:?set DEEPSEEK_API_KEY}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:?set DEEPSEEK_BASE_URL}"
      MINIMAX_API_KEY: "${LITELLM_MINIMAX_PROVIDER_API_KEY:-}"
      NO_DOCS: "True"
      NO_REDOC: "True"
      LITELLM_MODE: PRODUCTION
      LITELLM_NON_ROOT: "true"
      LITELLM_MIGRATION_DIR: /app/migrations
      PRISMA_BINARY_CACHE_DIR: /app/cache/prisma
      XDG_CACHE_HOME: /app/cache
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    tmpfs:
      - /tmp
      - /app/migrations
      - /app/cache
    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      litellm-key-policy:
        condition: service_completed_successfully
      litellm-db:
        condition: service_healthy
    networks:
      - askme-net
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://localhost:4000/health/readiness', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  askme-net:
    driver: bridge

volumes:
  litellm_db:
