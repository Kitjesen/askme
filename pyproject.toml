[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "askme"
version = "4.1.0"
description = "Voice AI Assistant with Skills, Robot Control, and Memory"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Shanghai Inovxio Technology Co., Ltd."},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]
dependencies = [
    "openai>=1.0.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.14.0",
    "numpy>=1.26.0",
    "sherpa-onnx>=1.13.4",
    "requests>=2.31.0",
    "websocket-client>=1.8.0",
    "fastapi>=0.103.0",
    "uvicorn>=0.23.0",
    "miniaudio>=1.61",
    "edge-tts>=7.2.8",
    "colorama>=0.4.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "mcp[cli]>=1.28.1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.16.4,<0.17",
    "mypy>=1.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]
robot = [
    "pyserial>=3.5",
    "onnxruntime>=1.16.0",
]
memory = [
    "mem0ai>=0.1.0",
    "fastembed>=0.4.0",
]
robotmem = [
    "robotmem[cjk]>=0.1.3,<0.2",
]
mempalace = [
    "mempalace==3.5.0",
]
vision = [
    "qp-perception>=0.1.0",
]
embed = [
    "fastembed>=0.4.0",
]

[project.scripts]
askme = "askme.cli:main"
askme-mcp = "askme.mcp.server:main"

[project.urls]
Homepage = "https://github.com/Kitjesen/askme"
Repository = "https://github.com/Kitjesen/askme"
Issues = "https://github.com/Kitjesen/askme/issues"

[tool.setuptools.packages.find]
include = ["askme*"]
exclude = ["askme.voice.native*"]

[tool.ruff]
exclude = ["archive/", ".tmp/", "data/pytest-tmp/", ".venv*/"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
# Ignored stylistic / pragmatic rules. Re-enable individually as the codebase
# converges. Real bugs (F-codes, UP-codes) stay enforced.
ignore = [
    "E501",  # line-too-long — 100-col is target, not strict; let formatter own it
    "E701",  # one-line if/colon — common in defensive guard clauses
    "E702",  # one-line semicolons — used in test setup helpers
    "E741",  # ambiguous variable name (l, I, O) — appears in stream-position locals
    "E402",  # module-level import not at top — used in conditional/sys.path setups
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]  # re-exports are intentional
"tests/**" = ["F841"]        # tests often assign for inspection
# Conditional imports for backend availability detection (cyclonedds/telegram/numpy)
"askme/robot/telemetry/pulse.py" = ["F401"]
"askme/runtime/modules/telegram_module.py" = ["F401"]
"askme/ports/speech_playback/contracts.py" = ["UP042"]  # preserve string-enum wire behavior

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
norecursedirs = ["tests/tmp", "data/pytest-tmp"]
addopts = ["-m", "not slow"]
markers = [
    "slow: slower integration/scenario coverage excluded from the default fast shard",
    "scenario: customer or runtime scenario evaluation tests",
    "e2e: end-to-end workflow tests",
    "benchmark: benchmark/regression threshold tests",
]

[tool.coverage.run]
source = ["askme"]
omit = ["askme/cli.py", "*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.coverage.html]
directory = "artifacts/coverage_html"

[tool.mypy]
python_version = "3.11"
# 宽松起步 — 逐步收紧
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false
warn_unused_ignores = false
# 至少检查这些
warn_no_return = true
warn_redundant_casts = true
