template:
  template_id: scenic-area-service
  version: 0.1.0
  publish_status: pilot
  release_channel: pilot
  owner: askme-product
  upgrade_policy: manual_review
  min_runtime_version: 4.0.0
  display_name: Scenic area service starter
  industry: scenic_area
  customer_claim: Starter profile for visitor guide, crowd, safety, and service point inspection.

customer:
  customer_id: template-customer
  customer_name: Template Customer
  industry: scenic_area
  project_id: scenic-area-service-project
  project_name: Scenic Area Service Project
  delivery_model: solution_project

site:
  site_id: template-scenic-site
  name: Template Scenic Site
  map_version: template-v1

responder_groups:
  security:
    name: Security Team
    webhook_env: ASKME_DINGTALK_SECURITY_WEBHOOK
    secret_env: ASKME_DINGTALK_SECURITY_SECRET
  cleaning:
    name: Cleaning Team
    webhook_env: ASKME_DINGTALK_CLEANING_WEBHOOK
    secret_env: ASKME_DINGTALK_CLEANING_SECRET
  operations:
    name: Visitor Operations
    webhook_env: ASKME_DINGTALK_OPERATIONS_WEBHOOK
    secret_env: ASKME_DINGTALK_OPERATIONS_SECRET

zones:
  visitor-main-road:
    name: Visitor main road
    location: Visitor main road
    type: main_channel
    parking_allowed: false
  tour-bus-parking:
    name: Tour bus parking
    location: Tour bus parking
    type: parking_area
    parking_allowed: true
  guide-kiosk:
    name: Guide kiosk
    location: Main gate
    type: help_point
    help_point_id: guide-kiosk
  scenic-crowd-zone:
    name: Scenic crowd zone
    location: Photo spot
    type: crowd_risk_area
  smoke-service-room:
    name: Service room
    location: Service room
    type: smoke_risk_area

devices:
  camera-guide-kiosk:
    name: Guide kiosk camera
    source: camera
    camera_id: cam-guide-kiosk
    zone_id: guide-kiosk
    secret_env: ASKME_FIELD_CAMERA_GUIDE_SECRET
  smoke-service-room:
    name: Service room sensor
    source: sensor
    sensor_type: smoke_temperature
    zone_id: smoke-service-room
    secret_env: ASKME_FIELD_SMOKE_WAREHOUSE_SECRET
  robot-scenic:
    name: Scenic robot
    source: robot
    robot_id: thunder-scenic
    zone_id: visitor-main-road
    secret_env: ASKME_FIELD_ROBOT_THUNDER_SECRET

thresholds:
  parking_duration_s: 120
  night_stranger_dwell_s: 10
  fire_temperature_c: 60
  smoke_level: 0.7
  trash_fill_ratio: 0.8
  crowd_person_count: 5
  crowd_duration_min: 30

managed_objects:
  visitors:
    display_name: Visitors and attractions
    category: visitor_service
    object_labels: [visitor, attraction, destination]
    scenario_ids: [wayfinding_help_point, visitor_escort]
    zone_types: [help_point]
    device_sources: [camera, robot]
    responder_group: operations
    evidence_required: [service_point, intent, route_result]
    bindings:
      vision_models: [person-dwell-detection]
      sensor_protocols: [voice-turn-json, robot-route-status-json]
      skill_packages: [capability.answer_wayfinding, capability.escort_visitor]
      acceptance_tests: [tests/test_space_cognition.py::visitor_escort]
    customer_visible: true
  crowds:
    display_name: Crowd gathering areas
    category: safety
    object_labels: [person, crowd]
    scenario_ids: [crowd_gathering]
    zone_types: [crowd_risk_area]
    device_sources: [camera]
    responder_group: security
    evidence_required: [photo, person_count, dwell_duration]
    bindings:
      vision_models: [person-counting]
      sensor_protocols: [camera-detection-json]
      skill_packages: [capability.detect_crowd_gathering]
      acceptance_tests: [tests/scenario_tests/test_field_operations_evaluation.py::crowd_gathering]
    customer_visible: true
