<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>现场任务平台</title>
  <link rel="stylesheet" href="/dashboard/app.css">
</head>
<body>
  <div class="product-shell">
    <aside class="nav-rail" aria-label="产品导航">
      <nav id="dashboard-nav" class="nav-list"></nav>
      <div class="nav-footer">
        <span id="global-status-dot" class="status-dot warn"></span>
        <span id="global-status-text">正在连接服务</span>
      </div>
    </aside>

    <main class="page-shell">
      <header class="page-header">
        <div>
          <p id="page-kicker" class="page-kicker">产品总览</p>
          <h1 id="page-title">现场任务平台</h1>
          <p id="page-description">把语音、知识、事件、客户项目和交付检查拆成可验收的产品页面。</p>
        </div>
        <div class="header-actions">
          <button class="ghost-button" data-route="/dashboard/projects">客户项目</button>
          <button class="primary-button" data-route="/dashboard/conversation">开始对话</button>
        </div>
      </header>

      <section id="app-page" class="page-content" aria-live="polite">
        <div class="loading-card">正在加载产品页面...</div>
      </section>
    </main>
  </div>

  <script src="/dashboard/app.js" defer></script>
</body>
</html>
