name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install ruff
        run: pip install "ruff>=0.3.0"
      - name: Ruff check
        run: ruff check askme/ tests/

  # Pure speech helpers. No PortAudio, PulseAudio, VAD model, or network.
  # The full test job below still runs these tests; this job only fails faster.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install pytest
        run: pip install "pytest>=9.2.0" "pytest-asyncio>=1.5.0"
      - name: Run pure speech unit tests
        run: |
          python -m pytest \
            tests/test_speech_correct_words.py \
            tests/test_speech_emotion.py \
            tests/test_speech_tts_retry.py \
            tests/test_speech_config_examples.py \
            -q --tb=short --override-ini="addopts="

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install system libs for sounddevice/soundfile
        run: |
          sudo apt-get update && sudo apt-get install -y libportaudio2 libsndfile1 pulseaudio
          # sounddevice calls Pa_Initialize() at import time. The runner's
          # PortAudio is built with the PulseAudio host API, and that call
          # fails the process when no server is running.
          if [ -z "${XDG_RUNTIME_DIR:-}" ]; then
            export XDG_RUNTIME_DIR="/tmp/runtime-$(id -u)"
            mkdir -p "$XDG_RUNTIME_DIR"
            chmod 700 "$XDG_RUNTIME_DIR"
            echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          fi
          pulseaudio --start --exit-idle-time=-1 --log-target=stderr
          pactl info
      - name: Install dependencies
        run: pip install -e ".[dev,embed]"
      - name: Download silero_vad.onnx for VAD-dependent tests
        run: |
          mkdir -p models/vad
          curl -sSL --retry 3 -o models/vad/silero_vad.onnx \
            https://github.com/snakers4/silero-vad/raw/master/src/silero_vad/data/silero_vad.onnx
      - name: Run tests
        run: python -m pytest tests/ -q --tb=short --maxfail=10 --durations=20
      - name: Coverage report
        if: always()
        run: python -m pytest tests/ -q --tb=short --cov=askme --cov-report=term-missing --cov-report=json -m "not slow" --maxfail=10
      - name: Performance smoke benchmark
        run: |
          python scripts/benchmark_core_paths.py --quick --iterations 40 --concurrency 8 --output artifacts/perf/core_paths_latest.json
          python scripts/check_perf_thresholds.py --report artifacts/perf/core_paths_latest.json

  types:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run mypy
        run: python -m mypy askme/ --ignore-missing-imports --no-error-summary

  security:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install bandit
        run: pip install bandit
      - name: Run bandit
        run: |
          mkdir -p artifacts
          bandit -r askme/ -ll -x askme/cli.py,askme/voice/diagnostics/,tests/ -f json -o artifacts/bandit-report.json

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install system libs for sounddevice/soundfile
        run: |
          sudo apt-get update && sudo apt-get install -y libportaudio2 libsndfile1 pulseaudio
          # sounddevice calls Pa_Initialize() at import time. The runner's
          # PortAudio is built with the PulseAudio host API, and that call
          # fails the process when no server is running.
          if [ -z "${XDG_RUNTIME_DIR:-}" ]; then
            export XDG_RUNTIME_DIR="/tmp/runtime-$(id -u)"
            mkdir -p "$XDG_RUNTIME_DIR"
            chmod 700 "$XDG_RUNTIME_DIR"
            echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          fi
          pulseaudio --start --exit-idle-time=-1 --log-target=stderr
          pactl info
      - name: Install dependencies
        run: pip install -e ".[dev,embed]"
      - name: Download silero_vad.onnx for VAD-dependent operations
        run: |
          mkdir -p models/vad
          curl -sSL --retry 3 -o models/vad/silero_vad.onnx \
            https://github.com/snakers4/silero-vad/raw/master/src/silero_vad/data/silero_vad.onnx
      - name: Run dialogue smoke test
        run: |
          python -m askme.cli runtime dialogue-smoke --fake-llm \
            --data-dir /tmp/ci-smoke-data \
            --output-dir /tmp/ci-smoke-output \
            --json 2>&1
