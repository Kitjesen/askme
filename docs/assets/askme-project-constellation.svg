<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AskMe project constellation</title>
  <desc id="desc">AskMe sits at the center of voice, conversation, knowledge, cognition, tasks, safety, runtime, and audit modules.</desc>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070c1b"/>
      <stop offset=".5" stop-color="#0b1025"/>
      <stop offset="1" stop-color="#060a17"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="45%" r="62%">
      <stop offset="0" stop-color="#fff6d5"/>
      <stop offset=".12" stop-color="#f7c76f"/>
      <stop offset=".35" stop-color="#bd7b31" stop-opacity=".78"/>
      <stop offset="1" stop-color="#35224d" stop-opacity=".2"/>
    </radialGradient>
    <radialGradient id="node" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#7456bd" stop-opacity=".88"/>
      <stop offset=".48" stop-color="#382760" stop-opacity=".88"/>
      <stop offset="1" stop-color="#17152f" stop-opacity=".92"/>
    </radialGradient>
    <pattern id="stars" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="22" r="1.4" fill="#ffffff" opacity=".62"/>
      <circle cx="78" cy="12" r="1" fill="#b99af5" opacity=".7"/>
      <circle cx="103" cy="66" r="1.5" fill="#ffffff" opacity=".45"/>
      <circle cx="42" cy="93" r="1" fill="#7ee7ff" opacity=".58"/>
      <circle cx="114" cy="112" r=".7" fill="#f7c76f" opacity=".72"/>
    </pattern>
    <filter id="violet-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gold-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 10 5 0 10Z" fill="#7ee7ff"/>
    </marker>
    <marker id="audit-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 10 5 0 10Z" fill="#b99af5"/>
    </marker>
  </defs>

  <rect width="1600" height="900" rx="28" fill="url(#space)"/>
  <rect width="1600" height="900" rx="28" fill="url(#stars)" opacity=".78"/>
  <g fill="none" stroke="#7456bd" opacity=".14">
    <circle cx="705" cy="420" r="265"/>
